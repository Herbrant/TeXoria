[package]
name = "tex-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tex-log.workspace = true
tex-project.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
which.workspace = true
# The ACP wire types only: the transport is ours (threads, like tex-git and tex-compile).
agent-client-protocol-schema = { version = "1.12", default-features = false }
futures-channel = "0.3"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
test-support.workspace = true
proptest.workspace = true
tempfile.workspace = true
futures-executor = "0.3"

# A scripted ACP agent for tests (see the file's documentation).
[[bin]]
name = "fake-acp-agent"
path = "tests/bin/fake_acp_agent.rs"
test = false
doc = false
