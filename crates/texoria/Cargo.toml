[package]
name = "texoria"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "An elegant, fast LaTeX editor"

[dependencies]
gpui-kit = { workspace = true, features = ["tree-sitter"] }
tex-log.workspace = true
synctex.workspace = true
tex-compile.workspace = true
tex-git.workspace = true
tex-syntax.workspace = true
tex-project.workspace = true
tex-complete.workspace = true
tex-spell.workspace = true
tex-agent.workspace = true
tex-update.workspace = true
tex-cite.workspace = true
tex-vim.workspace = true
pdf-view.workspace = true

anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
directories.workspace = true
# Versions shared with gpui-kit (completion items, async channels, frames).
lsp-types = { version = "0.97", features = ["proposed"] }
smol = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
# Pictures in the agents' tool answers.
base64 = "0.22"
# The system language: fallback for spell checking and regional variants.
sys-locale = "0.3"
tempfile.workspace = true
similar.workspace = true
# Format Document.
tex-fmt = { version = "0.5.7", default-features = false }

[build-dependencies]
embed-resource = "3"

# `cargo packager --release` (https://github.com/crabnebula-dev/cargo-packager).
# Run scripts/fetch-pdfium.sh and scripts/fetch-tectonic.sh first. Releases sign the .app and
# build the .dmg with scripts/package-macos.sh, and the .deb/.rpm with scripts/package-linux.sh.
[package.metadata.packager]
product-name = "TeXoria"
identifier = "app.texoria.TeXoria"
category = "Productivity"
description = "An elegant, fast LaTeX editor"
before-packaging-command = "cargo build -p texoria --release"
out-dir = "../../target/dist"
binaries = [{ path = "texoria", main = true }]
# Generated from assets/logo by scripts/gen-icons.sh.
icons = ["packaging/icons/*.png", "packaging/texoria.icns", "packaging/texoria.ico"]
formats = ["app", "dmg", "nsis", "appimage"]
resources = [
  { src = "../../vendor/pdfium/*", target = "." },
  { src = "../../vendor/tectonic/*", target = "bin" },
]

[package.metadata.packager.deb]
# Also used by the AppImage; scripts/package-linux.sh installs the same file.
desktop-template = "packaging/linux/texoria.desktop"

[package.metadata.packager.macos]
# GPUI's deployment target.
minimum-system-version = "10.15"
