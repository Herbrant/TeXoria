[package]
name = "texoria"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "An elegant, fast LaTeX editor"

[dependencies]
gpui-kit = { workspace = true, features = ["tree-sitter"] }
tex-log.workspace = true
synctex.workspace = true
tex-compile.workspace = true
tex-git.workspace = true
tex-syntax.workspace = true
tex-project.workspace = true
tex-complete.workspace = true
tex-spell.workspace = true
tex-agent.workspace = true
tex-update.workspace = true
tex-cite.workspace = true
tex-vim.workspace = true
pdf-view.workspace = true

anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
directories.workspace = true
# Versions shared with gpui-kit (completion items, async channels, frames).
lsp-types = { version = "0.97", features = ["proposed"] }
smol = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
# Pictures in the agents' tool answers.
base64 = "0.22"
# The system language: fallback for spell checking and regional variants.
sys-locale = "0.3"
tempfile.workspace = true
# Documents opened from the Finder come as file URLs.
url = "2"
similar.workspace = true
# Format Document.
tex-fmt = { version = "0.5.7", default-features = false }

[dev-dependencies]
# Headless windows for the UI tests (`#[gpui::test]`). gpui-kit's own `test-support` feature
# would also resolve its optional `gpui-fast` engine, whose exact pins conflict with gpui's.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
test-support.workspace = true
proptest.workspace = true

[build-dependencies]
embed-resource = "3"

# `cargo packager --release` (https://github.com/crabnebula-dev/cargo-packager).
# Run scripts/fetch-pdfium.sh and scripts/fetch-tectonic.sh first. Releases sign the .app and
# build the .dmg with scripts/package-macos.sh, and the .deb/.rpm with scripts/package-linux.sh.
[package.metadata.packager]
product-name = "TeXoria"
identifier = "app.texoria.TeXoria"
category = "Productivity"
description = "An elegant, fast LaTeX editor"
before-packaging-command = "cargo build -p texoria --release"
out-dir = "../../target/dist"
binaries = [{ path = "texoria", main = true }]
# Generated from assets/logo by scripts/gen-icons.sh.
icons = ["packaging/icons/*.png", "packaging/texoria.icns", "packaging/texoria.ico"]
formats = ["app", "dmg", "nsis", "appimage"]
resources = [
  { src = "../../vendor/pdfium/*", target = "." },
  { src = "../../vendor/tectonic/*", target = "bin" },
]

[package.metadata.packager.deb]
# Also used by the AppImage; scripts/package-linux.sh installs the same file.
desktop-template = "packaging/linux/texoria.desktop"

[package.metadata.packager.macos]
# GPUI's deployment target.
minimum-system-version = "10.15"
# The .tex documents the app opens (cargo-packager's file-associations only list extensions,
# which macOS ignores in favor of content types).
info-plist-path = "packaging/macos/Info.plist"

# .tex files get TeXoria in Explorer's "Open with", and open with it when no other app is set
# for them; the uninstaller takes it back (cargo-packager's file-associations replace the
# user's app for good, and its uninstaller leaves them). Runs before the Install section.
[package.metadata.packager.nsis]
preinstall-section = '''
Section "-FileTypes"
  WriteRegStr SHCTX "Software\Classes\TeXoria.tex" "" "LaTeX document"
  WriteRegStr SHCTX "Software\Classes\TeXoria.tex\DefaultIcon" "" "$INSTDIR\${MAINBINARYNAME}.exe,0"
  WriteRegStr SHCTX "Software\Classes\TeXoria.tex\shell\open\command" "" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\" $\"%1$\""
  WriteRegStr SHCTX "Software\Classes\.tex\OpenWithProgids" "TeXoria.tex" ""
  ReadRegStr $0 HKCR ".tex" ""
  ${If} $0 == ""
    WriteRegStr SHCTX "Software\Classes\.tex" "" "TeXoria.tex"
  ${EndIf}
  !insertmacro UPDATEFILEASSOC
SectionEnd

Function un.onUninstSuccess
  DeleteRegValue SHCTX "Software\Classes\.tex\OpenWithProgids" "TeXoria.tex"
  DeleteRegKey /ifempty SHCTX "Software\Classes\.tex\OpenWithProgids"
  ReadRegStr $0 SHCTX "Software\Classes\.tex" ""
  ${If} $0 == "TeXoria.tex"
    DeleteRegValue SHCTX "Software\Classes\.tex" ""
  ${EndIf}
  DeleteRegKey /ifempty SHCTX "Software\Classes\.tex"
  DeleteRegKey SHCTX "Software\Classes\TeXoria.tex"
  !insertmacro UPDATEFILEASSOC
FunctionEnd
'''
