name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Set init.defaultBranch for every git call (incl. actions/checkout's `git init`), which
  # otherwise prints a hint about the default branch name.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # Tests that need these fail instead of skipping (test_support::skip).
  TEXORIA_REQUIRE_GIT: 1
  TEXORIA_REQUIRE_PDFIUM: 1
  TEXORIA_REQUIRE_TEX: 1
  # The app's tests run the fake engine and agent built with tex-compile's and tex-agent's.
  TEXORIA_REQUIRE_FAKES: 1
  # Smaller builds and caches (all caches share 10 GB, and an evicted one costs a full rebuild):
  # file and line numbers are enough for a test's backtrace, and coverage does not use debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Every run builds the workspace from scratch: incremental data would only be written.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform a release is built for (release.yml, which also checks the release
        # build and the packaging every night).
        include:
          - { name: macos-aarch64, os: macos-latest }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-22.04-arm }
          - { name: windows-x86_64, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      # Pull requests read main's cache without adding their own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install Linux dependencies (GPUI, TeX)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            libasound2-dev libvulkan1 \
            latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            texlive-binaries cm-super

      # The sample project (tests/fixtures/sample) needs latexmk, BibTeX, amsmath and T1 fonts.
      - name: Install TinyTeX (macOS, Windows)
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-tinytex@v2
      - name: Install TeX packages (macOS, Windows)
        if: runner.os != 'Linux'
        # tlmgr is a .bat on Windows, which bash cannot run.
        shell: pwsh
        run: tlmgr install latexmk cm-super amsfonts

      - name: Fetch PDFium
        run: ./scripts/fetch-pdfium.sh

      # Tectonic downloads its support files on first use: keep them between runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Tectonic
            ~/Library/Caches/Tectonic
            ~/AppData/Local/TectonicProject
          key: tectonic-${{ matrix.name }}-${{ hashFiles('scripts/fetch-tectonic.sh') }}
      - name: Fetch Tectonic
        run: ./scripts/fetch-tectonic.sh

      - name: Format
        run: cargo fmt --all --check

      # Dependencies are the same on every platform: once is enough.
      - name: Target names
        if: matrix.name == 'linux-x86_64'
        run: ./scripts/check-target-names.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The bundled engine's test (ignored by default: it downloads the TeX bundle) runs in the
      # same instrumented build: --no-report keeps the first run's profiles, and the same
      # targets with a test filter (not `--test real_engine`, which would resolve other
      # features) rebuild nothing. There are no doctests (cargo-llvm-cov runs them only on
      # nightly): write unit tests instead.
      - name: Test with coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-fail-fast --no-report
          TEXORIA_REQUIRE_TECTONIC=1 cargo llvm-cov --workspace --no-report \
            -- --ignored compiles_sample_with_tectonic
          cargo llvm-cov report --json --summary-only --output-path target/coverage.json
          cargo llvm-cov report --lcov --output-path target/lcov.info

      - name: Coverage minimums
        run: ./scripts/coverage-check.sh target/coverage.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.name }}
          path: |
            target/coverage.json
            target/lcov.info
          if-no-files-found: ignore
