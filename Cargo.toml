[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["Davide Carnemolla <cdavide98carnemolla@gmail.com>"]

[workspace.dependencies]
# UI (pre-1.0: version pinned with "=")
gpui-kit = "=0.7.3"

# Core
anyhow = "1"
thiserror = "2"
flate2 = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
regex = "1"
directories = "6"
notify = "8"
which = "8"
tempfile = "3"
# Already pulled in by gpui-kit's diff viewer.
similar = "2.7"
# Not on crates.io for tree-sitter 0.25+ (the published 0.1.0 needs tree-sitter 0.22).
tree-sitter-bibtex = { git = "https://github.com/latex-lsp/tree-sitter-bibtex", rev = "8d04ed27b3bc7929f14b7df9236797dab9f3fa66" }

# Intra-workspace
tex-log = { path = "crates/tex-log" }
synctex = { path = "crates/synctex" }
tex-compile = { path = "crates/tex-compile" }
tex-git = { path = "crates/tex-git" }
tex-syntax = { path = "crates/tex-syntax" }
tex-project = { path = "crates/tex-project" }
tex-complete = { path = "crates/tex-complete" }
tex-spell = { path = "crates/tex-spell" }
tex-agent = { path = "crates/tex-agent" }
tex-update = { path = "crates/tex-update" }
tex-cite = { path = "crates/tex-cite" }
tex-vim = { path = "crates/tex-vim" }
pdf-view = { path = "crates/pdf-view" }

# Tests only
test-support = { path = "crates/test-support" }
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
