# Fuzz targets for the parsers and the other code that reads untrusted text
# (`cargo +nightly fuzz run <target>`; see docs/development). Not a workspace member: cargo-fuzz
# builds it with nightly and sanitizers.
[package]
name = "texoria-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
tex-log = { path = "../crates/tex-log" }
synctex = { path = "../crates/synctex" }
tex-syntax = { path = "../crates/tex-syntax" }
tex-project = { path = "../crates/tex-project" }
tex-complete = { path = "../crates/tex-complete" }
tex-cite = { path = "../crates/tex-cite" }
tex-spell = { path = "../crates/tex-spell" }
tex-git = { path = "../crates/tex-git" }
tex-vim = { path = "../crates/tex-vim" }

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "tex_log"
path = "fuzz_targets/tex_log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "synctex"
path = "fuzz_targets/synctex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bib"
path = "fuzz_targets/bib.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tex_index"
path = "fuzz_targets/tex_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "complete"
path = "fuzz_targets/complete.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cite"
path = "fuzz_targets/cite.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grammar"
path = "fuzz_targets/grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "urls"
path = "fuzz_targets/urls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vim"
path = "fuzz_targets/vim.rs"
test = false
doc = false
bench = false
